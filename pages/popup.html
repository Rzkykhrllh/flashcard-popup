<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="head">
      <span class="seal"></span>
      <h1>Nihongo Popup</h1>
    </div>

    <div class="stats">
      <div class="stat"><span class="num" id="cardCount">—</span><span class="lbl">cards</span></div>
      <div class="stat"><span class="num" id="deckCount">—</span><span class="lbl">decks</span></div>
    </div>
    <p class="sync" id="syncStatus">Never synced.</p>

    <button class="btn primary" id="quizBtn">Show card now</button>
    <button class="btn" id="addWordShortcut">Add word</button>
    <button class="btn ghost" id="openBankBtn">Open Kotoba Bank</button>

    <div class="quick-add" id="quickAdd">
      <input id="qaKanji" type="text" placeholder="Kanji" autocomplete="off" />
      <input id="qaHiragana" type="text" placeholder="Reading (hiragana)" autocomplete="off" />
      <input id="qaArti" type="text" placeholder="Meaning" autocomplete="off" />
      <textarea id="qaNotes" rows="2" placeholder="Notes (optional)"></textarea>
      <div id="qaGroupChecklist" class="group-checklist"></div>
      <div class="group-new-row">
        <input id="qaNewGroupName" type="text" placeholder="New collection name" autocomplete="off" />
        <button type="button" class="btn" id="qaAddGroupBtn">Add</button>
      </div>
      <label class="field-check">
        <input id="qaIncludeInStudy" type="checkbox" checked />
        Include in current learning (Study &amp; popup)
      </label>
      <p id="qaStatus" class="qa-status"></p>
      <div class="btn-row">
        <button class="btn" id="qaCancelBtn">Cancel</button>
        <button class="btn primary" id="qaSaveBtn">Save</button>
      </div>
    </div>

    <p class="state" id="enabledState"></p>

    <p class="credit">by <a href="https://dev.byairu.com" target="_blank">dev.byairu.com</a></p>
    <script src="../core/db.js"></script>
    <script src="../core/kanji.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
